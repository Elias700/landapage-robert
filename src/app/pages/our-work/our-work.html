<section
  id="nosso-trabalho" 
  data-gsap-horizontal-section
  class="
    rs-gallery-section
    py-16 
    md:py-24 
    bg-white 
    text-text 
    relative 
    overflow-hidden
  "
>
  <div class="rs-work-inner max-w-7xl mx-auto px-6 lg:px-12">

    <div class="rs-gallery-header flex flex-col md:flex-row md:items-end justify-between mb-8 sm:mb-12 gap-6">

      <div class="rs-gallery-heading max-w-2xl" data-gsap-reveal>
        <div class="inline-flex items-center gap-2 mb-3">
          <span class="w-8 h-[2px] bg-solar"></span>
          <span class="text-xs md:text-sm font-semibold tracking-wider text-text-muted uppercase">
            Trabalho na Prática
          </span>
          <span class="w-8 h-[2px] bg-solar"></span>
        </div>

        <h2 class="text-3xl sm:text-4xl lg:text-5xl font-normal text-text leading-[1.15] tracking-tight">
          Confira alguns dos nossos <br class="hidden sm:inline" />
          <span class="italic font-serif font-medium text-solar-dark">
            projetos e instalações.
          </span>
        </h2>
      </div>

      <!-- Setas de Navegação -->
      <div class="flex items-center gap-3 self-end md:self-auto">
        <!-- Botão Esquerda -->
        <button 
          type="button" 
          (click)="scrollLeft()" 
          [disabled]="!canScrollLeft()" 
          [class.opacity-40]="!canScrollLeft()"
          [class.cursor-not-allowed]="!canScrollLeft()" 
          [class.hover:bg-solar]="canScrollLeft()"
          [class.hover:border-solar]="canScrollLeft()" 
          aria-label="Rolar projetos para a esquerda"
          class="
            w-12 h-12 
            rounded-full 
            border 
            border-gray-200 
            flex 
            items-center 
            justify-center 
            text-text 
            transition-colors 
            duration-300 
            shadow-sm 
            active:scale-95 
            cursor-pointer
          "
        >
          <mat-icon class="!w-6 !h-6 !text-[22px]">arrow_back</mat-icon>
        </button>

        <!-- Botão Direita -->
        <button 
          type="button" 
          (click)="scrollRight()" 
          [disabled]="!canScrollRight()"
          [class.opacity-40]="!canScrollRight()" 
          [class.cursor-not-allowed]="!canScrollRight()"
          [class.hover:bg-solar]="canScrollRight()" 
          [class.hover:border-solar]="canScrollRight()" 
          aria-label="Rolar projetos para a direita"
          class="
            w-12 h-12 
            rounded-full 
            border 
            border-gray-200 
            flex 
            items-center 
            justify-center 
            text-text 
            transition-colors 
            duration-300 
            shadow-sm 
            active:scale-95 
            cursor-pointer
          "
        >
          <mat-icon class="!w-6 !h-6 !text-[22px]">arrow_forward</mat-icon>
        </button>
      </div>

    </div>

    <!-- Carrossel -->
    <div
      #carouselContainer 
      data-gsap-horizontal-track
      role="region"
      aria-label="Projetos de energia solar"
      tabindex="0"
      (keydown)="onCarouselKeydown($event)"
      (scroll)="checkScrollPosition()"
      class="rs-gallery-track
        flex 
        gap-4 
        sm:gap-6 
        lg:gap-8 
        overflow-x-auto 
        snap-x 
        snap-mandatory 
        scrollbar-none 
        pb-4 
        scroll-smooth
      "
    >
      @for (item of workItems; track item.id; let idx = $index) {
      <div
        role="group"
        [attr.aria-label]="'Projeto ' + item.id + ' de ' + workItems.length"
        class="rs-gallery-card
          w-full 
          sm:w-[380px] 
          md:w-[460px] 
          lg:w-[520px] 
          h-[260px] 
          sm:h-[280px] 
          md:h-[340px] 
          lg:h-[380px] 
          rounded-3xl 
          overflow-hidden 
          shadow-md 
          bg-gray-100 
          group 
          border 
          border-gray-100 
          snap-center 
          sm:snap-start 
          flex-shrink-0
        "
      >
        <span class="rs-gallery-index" aria-hidden="true">{{ idx + 1 | number:'2.0' }} <span>/ 08</span></span>
        @if (item.type === 'video') {
        <video 
          #videoElement 
          [src]="item.src" 
          [poster]="item.poster || ''"
          playsinline 
          preload="metadata"
          aria-label="Vídeo de instalação solar. Use os controles para reproduzir."
          controls
          class="
            w-full 
            h-full 
            object-cover
          "
        ></video>
        } @else {
        <img
          [src]="item.src" 
          [attr.srcset]="item.src.replace('.jpeg', '-600.jpeg') + ' 600w, ' + item.src.replace('.jpeg', '-1100.jpeg') + ' 1100w'"
          sizes="(max-width: 639px) 100vw, (max-width: 1023px) 460px, 520px"
          loading="lazy"
          decoding="async"
          alt="Instalação de painéis solares"
          class="
            w-full 
            h-full 
            object-cover 
            group-hover:scale-105 
            transition-transform 
            duration-500
          " 
        />
        }
      </div>
      }
    </div>

  </div>
</section>
